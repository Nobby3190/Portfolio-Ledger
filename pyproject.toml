[project]
name = "portfolio-ledger"
version = "2.1.0"
description = "把投資和記帳放在同一本帳裡的 Mac 桌面 app"
readme = "README.md"
authors = [
    { name = "Nobby Hsieh", email = "zuzu60410@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.7.22",
    "httpx>=0.28.1",
    "pyobjc-framework-localauthentication>=12.2.2 ; sys_platform == 'darwin'",
    "pywebview>=6.2.1",
]

[project.scripts]
portfolio-ledger = "portfolio_ledger:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
